<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySheba - Manage Services</title>
    <script src="data-storage.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1D4ED8 0%, #22C55E 100%);
            min-height: 100vh;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(29, 78, 216, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1D4ED8;
            font-weight: bold;
        }

        .header-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1f2937;
        }

        .add-btn {
            background: #1D4ED8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .screen-content {
            padding-top: 80px;
            padding-bottom: 20px;
            min-height: 100vh;
        }

        .services-list {
            padding: 0 1rem;
        }

        .service-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin: 8px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .service-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .service-icon {
            font-size: 2rem;
        }

        .service-details h4 {
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 4px 0;
        }

        .service-details p {
            color: #6b7280;
            font-size: 0.875rem;
            margin: 0;
        }

        .service-actions {
            display: flex;
            gap: 0.5rem;
        }

        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1D4ED8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
        }

        .modal-title {
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .save-btn, .cancel-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn {
            background: #1D4ED8;
            color: white;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
        }

        .toast {
            position: fixed;
            top: 80px;
            left: 16px;
            right: 16px;
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            text-align: center;
            z-index: 70;
            font-weight: 500;
            background: #22C55E;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="back-btn" onclick="goBack()">←</div>
        <h1 class="header-title">Manage Services</h1>
        <button class="add-btn" onclick="showAddModal()">+ Add Service</button>
    </div>

    <div class="screen-content">
        <div class="services-list" id="services-container">
            <!-- Services will be loaded here -->
        </div>
    </div>

    <!-- Add/Edit Service Modal -->
    <div id="service-modal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title" id="modal-title">Add New Service</h3>
            <form id="service-form">
                <input type="hidden" id="service-id">
                <input type="text" id="service-name" class="form-input" placeholder="Service Name" required>
                <input type="text" id="service-icon" class="form-input" placeholder="Emoji Icon" required>
                <input type="text" id="service-category" class="form-input" placeholder="Category (cleaning, plumbing, etc.)" required>
                <input type="number" id="service-price" class="form-input" placeholder="Base Price" required>
                <textarea id="service-description" class="form-input" placeholder="Description" rows="3"></textarea>
                <div class="modal-actions">
                    <button type="submit" class="save-btn" id="modal-save-btn">Save</button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let editingServiceId = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Check if admin
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser || currentUser.userType !== 'admin') {
                window.location.href = 'auth.html';
                return;
            }

            loadServices();
            
            // Handle form submission
            document.getElementById('service-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveService();
            });
        });

        function loadServices() {
            const services = easysheba.getServices();
            const container = document.getElementById('services-container');
            
            let html = '';
            services.forEach(service => {
                html += `
                    <div class="service-card">
                        <div class="service-info">
                            <div class="service-icon">${service.icon}</div>
                            <div class="service-details">
                                <h4>${service.name}</h4>
                                <p>${service.description || 'No description'}</p>
                                <p>Category: ${service.category} • Base Price: ৳${service.basePrice}</p>
                            </div>
                        </div>
                        <div class="service-actions">
                            <button class="edit-btn" onclick="editService(${service.id})">Edit</button>
                            <button class="delete-btn" onclick="deleteService(${service.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html || '<p style="text-align: center; color: white;">No services found</p>';
        }

        function showAddModal() {
            editingServiceId = null;
            document.getElementById('modal-title').textContent = 'Add New Service';
            document.getElementById('service-form').reset();
            document.getElementById('service-modal').style.display = 'flex';
        }

        function editService(serviceId) {
            const services = easysheba.getServices();
            const service = services.find(s => s.id === serviceId);
            
            if (service) {
                editingServiceId = serviceId;
                document.getElementById('modal-title').textContent = 'Edit Service';
                document.getElementById('service-id').value = service.id;
                document.getElementById('service-name').value = service.name;
                document.getElementById('service-icon').value = service.icon;
                document.getElementById('service-category').value = service.category;
                document.getElementById('service-price').value = service.basePrice;
                document.getElementById('service-description').value = service.description || '';
                document.getElementById('service-modal').style.display = 'flex';
            }
        }

        function saveService() {
            const serviceData = {
                name: document.getElementById('service-name').value,
                icon: document.getElementById('service-icon').value,
                category: document.getElementById('service-category').value,
                basePrice: parseInt(document.getElementById('service-price').value),
                description: document.getElementById('service-description').value
            };

            if (editingServiceId) {
                easysheba.updateService(editingServiceId, serviceData);
                showToast('Service updated successfully!');
            } else {
                easysheba.addService(serviceData);
                showToast('Service added successfully!');
            }

            closeModal();
            loadServices();
        }

        function deleteService(serviceId) {
            if (confirm('Are you sure you want to delete this service?')) {
                easysheba.deleteService(serviceId);
                loadServices();
                showToast('Service deleted!');
            }
        }

        function closeModal() {
            document.getElementById('service-modal').style.display = 'none';
        }

        function goBack() {
            window.location.href = 'admin-dashboard.html';
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
