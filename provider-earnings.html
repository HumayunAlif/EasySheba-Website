<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySheba - My Earnings</title>
    <script src="data-storage.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1D4ED8;
            --secondary: #22C55E;
            --dark: #1f2937;
            --light: #f9fafb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Header */
        .app-header {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 16px 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notification-btn {
            position: relative;
            background: #f1f5f9;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--dark);
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .notification-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .user-profile:hover {
            background: #f1f5f9;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .user-info h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 2px;
        }

        .user-info p {
            font-size: 12px;
            color: #6b7280;
        }

        /* Main Content */
        .main-content {
            margin-top: 88px;
            padding: 24px;
        }

        /* Earnings Overview */
        .earnings-overview {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            padding: 32px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(29, 78, 216, 0.3);
            text-align: center;
        }

        .overview-label {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .overview-amount {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .overview-subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 24px;
        }

        .withdraw-btn {
            background: white;
            color: var(--primary);
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .withdraw-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            margin: 0 auto 16px;
        }

        .stat-icon.primary { background: var(--primary); }
        .stat-icon.success { background: var(--success); }
        .stat-icon.warning { background: var(--warning); }
        .stat-icon.info { background: #8b5cf6; }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
        }

        /* Earnings Chart */
        .chart-section {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-filter {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        .chart-placeholder {
            height: 200px;
            background: #f8fafc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }

        /* Transactions */
        .transactions-section {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
            background: #f9fafb;
            transition: all 0.3s ease;
        }

        .transaction-item:hover {
            background: #f1f5f9;
            transform: translateX(5px);
        }

        .transaction-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-right: 16px;
        }

        .transaction-details {
            flex: 1;
        }

        .transaction-details h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .transaction-details p {
            color: #6b7280;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transaction-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--success);
        }

        .transaction-amount.negative {
            color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #e5e7eb;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #9ca3af;
        }

        .empty-description {
            font-size: 14px;
            margin-bottom: 24px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #9ca3af;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--primary);
            background: rgba(29, 78, 216, 0.1);
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 600;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }

        /* Responsive */
        @media (max-width: 768px) {
            .overview-amount {
                font-size: 36px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .time-filter {
                overflow-x: auto;
                padding-bottom: 10px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .overview-amount {
                font-size: 28px;
            }
            
            .header-title {
                font-size: 20px;
            }
            
            .user-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <h1 class="header-title">My Earnings</h1>
        </div>
        
        <div class="user-menu">
            <div class="notification-btn" onclick="showNotifications()">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="notification-count">0</span>
            </div>
            
            <div class="user-profile" onclick="goToProfile()">
                <div class="user-avatar" id="user-avatar">PU</div>
                <div class="user-info">
                    <h4 id="user-name">Provider User</h4>
                    <p>Service Provider</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Earnings Overview -->
        <section class="earnings-overview">
            <div class="overview-label">Total Earnings</div>
            <div class="overview-amount" id="total-earnings">৳0</div>
            <div class="overview-subtitle">Available for withdrawal</div>
            <button class="withdraw-btn" onclick="requestWithdrawal()">
                <i class="fas fa-wallet"></i> Request Withdrawal
            </button>
        </section>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon primary">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <h3 class="stat-value" id="completed-jobs">0</h3>
                <p class="stat-label">Completed Jobs</p>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon success">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h3 class="stat-value" id="avg-earning">৳0</h3>
                <p class="stat-label">Avg per Job</p>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon warning">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <h3 class="stat-value" id="this-month">৳0</h3>
                <p class="stat-label">This Month</p>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon info">
                    <i class="fas fa-trophy"></i>
                </div>
                <h3 class="stat-value" id="rating">0.0</h3>
                <p class="stat-label">Average Rating</p>
            </div>
        </div>

        <!-- Earnings Chart -->
        <section class="chart-section">
            <div class="section-header">
                <h2 class="section-title">
                    <i class="fas fa-chart-bar"></i>
                    Earnings Trend
                </h2>
                <div class="time-filter">
                    <button class="filter-btn active" onclick="filterEarnings('week')">Week</button>
                    <button class="filter-btn" onclick="filterEarnings('month')">Month</button>
                    <button class="filter-btn" onclick="filterEarnings('year')">Year</button>
                </div>
            </div>
            <div class="chart-placeholder">
                <i class="fas fa-chart-line" style="font-size: 48px; margin-bottom: 10px;"></i>
                <div>Earnings chart will be displayed here</div>
            </div>
        </section>

        <!-- Recent Transactions -->
        <section class="transactions-section">
            <div class="transactions-header">
                <h2 class="section-title">
                    <i class="fas fa-exchange-alt"></i>
                    Recent Transactions
                </h2>
                <button class="filter-btn" onclick="viewAllTransactions()">
                    View All
                </button>
            </div>
            
            <div class="transactions-list" id="transactions-list">
                <!-- Transactions will be loaded here -->
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="provider-jobs.html" class="nav-item">
            <i class="fas fa-tasks"></i>
            <span>Jobs</span>
        </a>
        <a href="provider-earnings.html" class="nav-item active">
            <i class="fas fa-chart-line"></i>
            <span>Earnings</span>
        </a>
        <a href="customer-dashboard.html" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Find Jobs</span>
        </a>
        <a href="provider-profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        let currentProvider = null;
        let currentFilter = 'week';

        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            const userData = localStorage.getItem('currentUser');
            if (!userData) {
                window.location.href = 'auth.html';
                return;
            }
            
            try {
                currentProvider = JSON.parse(userData);
                if (currentProvider.userType !== 'provider') {
                    window.location.href = currentProvider.userType === 'admin' ? 
                        'admin-dashboard.html' : 'customer-dashboard.html';
                    return;
                }
                
                initializeEarningsPage();
            } catch (error) {
                console.error('Error:', error);
                window.location.href = 'auth.html';
            }
        });

        function initializeEarningsPage() {
            // Set user info
            document.getElementById('user-name').textContent = 
                `${currentProvider.firstName} ${currentProvider.lastName}`;
            document.getElementById('user-avatar').textContent = 
                (currentProvider.firstName.charAt(0) + currentProvider.lastName.charAt(0)).toUpperCase();
            
            // Load earnings data
            loadEarningsData();
            
            // Load transactions
            loadRecentTransactions();
            
            // Load notifications count
            loadNotificationCount();
        }

        function loadEarningsData() {
            const providerStats = easysheba.getProviderStats(currentProvider.id);
            const bookings = easysheba.getBookingsByProvider(currentProvider.id);
            
            // Total earnings
            const totalEarnings = currentProvider.earnings || 0;
            
            // Completed jobs
            const completedJobs = bookings.filter(b => b.status === 'completed').length;
            
            // Average per job
            const avgEarning = completedJobs > 0 ? 
                Math.round(totalEarnings / completedJobs) : 0;
            
            // This month's earnings
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            const thisMonthEarnings = bookings
                .filter(b => b.status === 'completed')
                .filter(job => {
                    try {
                        if (job.completedAt) {
                            const jobDate = new Date(job.completedAt);
                            return jobDate.getMonth() === currentMonth && 
                                   jobDate.getFullYear() === currentYear;
                        }
                    } catch (e) {}
                    return false;
                })
                .reduce((sum, job) => sum + (job.totalAmount || 0), 0);
            
            // Average rating
            const rating = currentProvider.rating || 0;
            
            // Update displays
            document.getElementById('total-earnings').textContent = `৳${totalEarnings}`;
            document.getElementById('completed-jobs').textContent = completedJobs;
            document.getElementById('avg-earning').textContent = `৳${avgEarning}`;
            document.getElementById('this-month').textContent = `৳${thisMonthEarnings}`;
            document.getElementById('rating').textContent = rating.toFixed(1);
        }

        function filterEarnings(filter) {
            currentFilter = filter;
            
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // In a real app, this would update the chart
            // For now, just show a message
            showToast(`Showing ${filter} earnings data`, 'info');
        }

        function loadRecentTransactions() {
            const bookings = easysheba.getBookingsByProvider(currentProvider.id);
            const completedBookings = bookings
                .filter(b => b.status === 'completed')
                .sort((a, b) => {
                    const dateA = a.completedAt ? new Date(a.completedAt) : new Date(0);
                    const dateB = b.completedAt ? new Date(b.completedAt) : new Date(0);
                    return dateB - dateA;
                })
                .slice(0, 5); // Last 5 transactions

            const container = document.getElementById('transactions-list');
            
            if (completedBookings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-money-bill-wave"></i>
                        </div>
                        <h3 class="empty-title">No Transactions Yet</h3>
                        <p class="empty-description">
                            Complete your first job to see earnings here
                        </p>
                        <button class="withdraw-btn" onclick="window.location.href='provider-jobs.html'">
                            <i class="fas fa-tasks"></i> Check Job Requests
                        </button>
                    </div>
                `;
                return;
            }
            
            let html = '';
            completedBookings.forEach(booking => {
                const customer = easysheba.getUserById(booking.customerId);
                const customerName = customer ? `${customer.firstName} ${customer.lastName}` : 'Customer';
                
                let formattedDate = 'Date not available';
                try {
                    if (booking.completedAt) {
                        const date = new Date(booking.completedAt);
                        formattedDate = date.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });
                    } else if (booking.serviceDate) {
                        const date = new Date(booking.serviceDate);
                        formattedDate = date.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric'
                        });
                    }
                } catch (e) {}
                
                html += `
                    <div class="transaction-item" onclick="viewJobDetails('${booking.bookingCode}')">
                        <div class="transaction-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="transaction-details">
                            <h4>Job with ${customerName}</h4>
                            <p>
                                <i class="far fa-calendar"></i> ${formattedDate} • 
                                <i class="fas fa-hashtag"></i> ${booking.bookingCode}
                            </p>
                        </div>
                        <div class="transaction-amount">
                            +৳${booking.totalAmount || 0}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function requestWithdrawal() {
            if (!currentProvider || !currentProvider.earnings || currentProvider.earnings === 0) {
                showToast('No earnings available for withdrawal.', 'error');
                return;
            }
            
            const amount = currentProvider.earnings;
            if (confirm(`Request withdrawal of ৳${amount}? Funds will be transferred within 3-5 business days.`)) {
                // In a real app, this would send a withdrawal request
                showToast(`Withdrawal request submitted for ৳${amount}.`, 'success');
                
                // Reset earnings (for demo purposes only)
                // In real app, you would have a separate withdrawal system
                // easysheba.updateUser(currentProvider.id, { earnings: 0 });
            }
        }

        function viewAllTransactions() {
            // In a real app, this would go to a detailed transactions page
            showToast('All transactions view coming soon!', 'info');
        }

        function viewJobDetails(bookingCode) {
            localStorage.setItem('viewBookingCode', bookingCode);
            window.location.href = 'booking-details.html';
        }

        function goBack() {
            window.location.href = 'provider-jobs.html';
        }

        function goToProfile() {
            window.location.href = 'provider-profile.html';
        }

        function loadNotificationCount() {
            const notifications = easysheba.getNotificationsByUser(currentProvider.id);
            const unreadCount = notifications.filter(n => !n.isRead).length;
            
            const badge = document.getElementById('notification-count');
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function showNotifications() {
            // Similar notifications modal
            const notifications = easysheba.getNotificationsByUser(currentProvider.id);
            
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 1000;
                display: flex;
                justify-content: flex-end;
                animation: fadeIn 0.3s ease;
            `;
            
            modal.innerHTML = `
                <div style="
                    width: 400px;
                    background: white;
                    height: 100%;
                    padding: 24px;
                    overflow-y: auto;
                    box-shadow: -4px 0 30px rgba(0,0,0,0.1);
                ">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <h3 style="font-size: 20px; font-weight: 700; color: var(--dark);">
                            <i class="fas fa-bell"></i> Notifications
                        </h3>
                        <button onclick="this.closest('div[style*=\"position: fixed\"]').remove()" 
                                style="background: none; border: none; font-size: 24px; color: #6b7280; cursor: pointer;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    ${notifications.length === 0 ? `
                        <div style="text-align: center; padding: 40px; color: #9ca3af;">
                            <i class="far fa-bell-slash" style="font-size: 48px; margin-bottom: 16px;"></i>
                            <p>No notifications yet</p>
                        </div>
                    ` : notifications.map(notif => `
                        <div style="
                            padding: 16px;
                            border-radius: 12px;
                            background: ${notif.isRead ? '#f9fafb' : '#f0f9ff'};
                            margin-bottom: 12px;
                            border-left: 4px solid ${notif.type === 'success' ? '#10b981' : notif.type === 'error' ? '#ef4444' : '#1D4ED8'};
                            cursor: pointer;
                        " onclick="markNotificationAsRead(${notif.id})">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <strong style="color: var(--dark);">${notif.title}</strong>
                                <small style="color: #9ca3af;">${new Date(notif.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                            </div>
                            <p style="color: #6b7280; font-size: 14px; margin: 0;">${notif.message}</p>
                            ${!notif.isRead ? '<div style="width: 8px; height: 8px; background: #1D4ED8; border-radius: 50%; margin-top: 8px;"></div>' : ''}
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }

        function markNotificationAsRead(notificationId) {
            easysheba.markNotificationAsRead(notificationId);
            loadNotificationCount();
            showToast('Notification marked as read', 'success');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                ${message}
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
