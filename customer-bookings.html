<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySheba - My Bookings</title>
    <script src="data-storage.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1D4ED8;
            --secondary: #22C55E;
            --dark: #1f2937;
            --light: #f9fafb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Header */
        .app-header {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 16px 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateX(-2px);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stats Banner */
        .stats-banner {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            padding: 24px;
            margin: 24px;
            margin-top: 88px;
            color: white;
            box-shadow: 0 8px 30px rgba(29, 78, 216, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-content h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stats-content p {
            opacity: 0.9;
            font-size: 14px;
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
        }

        .stats-number {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stats-label {
            font-size: 12px;
            opacity: 0.9;
        }

        /* Tabs */
        .booking-tabs {
            background: white;
            margin: 0 24px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            padding: 0;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .tab:hover {
            color: var(--primary);
            background: rgba(29, 78, 216, 0.05);
        }

        .tab.active {
            color: var(--primary);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }

        .tab-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #e5e7eb;
            color: #6b7280;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .tab.active .tab-badge {
            background: var(--primary);
            color: white;
        }

        /* Bookings Container */
        .bookings-container {
            padding: 0 24px 100px;
        }

        /* Empty State */
        .empty-state {
            background: white;
            border-radius: 20px;
            padding: 60px 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .empty-icon {
            font-size: 72px;
            margin-bottom: 20px;
            color: #e5e7eb;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .empty-description {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        /* Booking Card */
        .booking-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-left: 4px solid;
            transition: all 0.3s ease;
        }

        .booking-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .booking-card.pending { border-color: var(--warning); }
        .booking-card.confirmed { border-color: var(--primary); }
        .booking-card.assigned { border-color: var(--secondary); }
        .booking-card.completed { border-color: var(--success); }
        .booking-card.cancelled { border-color: var(--danger); }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .booking-code {
            font-weight: 700;
            color: var(--primary);
            font-size: 14px;
            background: rgba(29, 78, 216, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .booking-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-confirmed { background: #dbeafe; color: #1e40af; }
        .status-assigned { background: #d1fae5; color: #065f46; }
        .status-completed { background: #dcfce7; color: #16a34a; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #6b7280;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .provider-info {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .provider-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.2);
        }

        .provider-details h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .provider-details p {
            color: #6b7280;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating {
            color: #f59e0b;
        }

        .booking-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-outline {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #9ca3af;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--primary);
            background: rgba(29, 78, 216, 0.1);
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 600;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 100px;
            left: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-banner {
                flex-direction: column;
                gap: 20px;
                text-align: center;
                margin: 16px;
                margin-top: 88px;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .bookings-container {
                padding: 0 16px 100px;
            }

            .booking-tabs {
                margin: 0 16px 16px;
            }
        }

        @media (max-width: 480px) {
            .tabs-header {
                overflow-x: auto;
                white-space: nowrap;
            }

            .tab {
                min-width: 100px;
            }

            .app-header {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="header-title">My Bookings</h1>
        </div>
        <a href="customer-dashboard.html" class="logo">
            <div class="logo-icon">🛠️</div>
            <div class="logo-text">EasySheba</div>
        </a>
    </header>

    <!-- Stats Banner -->
    <div class="stats-banner" id="stats-banner">
        <!-- Stats will be loaded here -->
    </div>

    <!-- Tabs -->
    <div class="booking-tabs">
        <div class="tabs-header">
            <div class="tab active" onclick="switchTab('all')">
                All Bookings <span class="tab-badge" id="all-count">0</span>
            </div>
            <div class="tab" onclick="switchTab('upcoming')">
                Upcoming <span class="tab-badge" id="upcoming-count">0</span>
            </div>
            <div class="tab" onclick="switchTab('completed')">
                Completed <span class="tab-badge" id="completed-count">0</span>
            </div>
            <div class="tab" onclick="switchTab('cancelled')">
                Cancelled <span class="tab-badge" id="cancelled-count">0</span>
            </div>
        </div>
    </div>

    <!-- Bookings Container -->
    <div class="bookings-container" id="bookings-container">
        <!-- Bookings will be loaded here -->
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="customer-dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="customer-bookings.html" class="nav-item active">
            <i class="fas fa-calendar-alt"></i>
            <span>Bookings</span>
        </a>
        <a href="chat.html" class="nav-item">
            <i class="fas fa-comments"></i>
            <span>Chats</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        let currentTab = 'all';
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            const userData = localStorage.getItem('currentUser');
            if (!userData) {
                window.location.href = 'auth.html';
                return;
            }
            
            try {
                currentUser = JSON.parse(userData);
                if (currentUser.userType !== 'customer') {
                    window.location.href = currentUser.userType === 'admin' ? 
                        'admin-dashboard.html' : 'provider-jobs.html';
                    return;
                }

                loadStats();
                loadBookings();

            } catch (error) {
                console.error('Error:', error);
                window.location.href = 'auth.html';
            }
        });

        function loadStats() {
            const bookings = easysheba.getBookingsByCustomer(currentUser.id);
            
            const allCount = bookings.length;
            const upcomingCount = bookings.filter(b => 
                b.status === 'pending' || b.status === 'confirmed' || b.status === 'assigned'
            ).length;
            const completedCount = bookings.filter(b => b.status === 'completed').length;
            const cancelledCount = bookings.filter(b => b.status === 'cancelled').length;
            
            // Update tab badges
            document.getElementById('all-count').textContent = allCount;
            document.getElementById('upcoming-count').textContent = upcomingCount;
            document.getElementById('completed-count').textContent = completedCount;
            document.getElementById('cancelled-count').textContent = cancelledCount;
            
            // Update stats banner
            const totalSpent = bookings
                .filter(b => b.status === 'completed')
                .reduce((sum, b) => sum + (b.totalAmount || 0), 0);
            
            document.getElementById('stats-banner').innerHTML = `
                <div class="stats-content">
                    <h2>${currentUser.firstName}'s Bookings</h2>
                    <p>Manage and track all your service bookings</p>
                </div>
                <div class="stats-badge">
                    <div class="stats-number">${allCount}</div>
                    <div class="stats-label">Total Bookings</div>
                </div>
            `;
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.remove('active');
            });
            event.target.closest('.tab').classList.add('active');
            
            // Load bookings for this tab
            loadBookings();
        }

        function loadBookings() {
            const bookings = easysheba.getBookingsByCustomer(currentUser.id);
            let filteredBookings = [];
            
            // Filter by current tab
            switch(currentTab) {
                case 'all':
                    filteredBookings = bookings;
                    break;
                case 'upcoming':
                    filteredBookings = bookings.filter(b => 
                        b.status === 'pending' || b.status === 'confirmed' || b.status === 'assigned'
                    );
                    break;
                case 'completed':
                    filteredBookings = bookings.filter(b => b.status === 'completed');
                    break;
                case 'cancelled':
                    filteredBookings = bookings.filter(b => b.status === 'cancelled');
                    break;
            }
            
            // Sort by date (newest first)
            filteredBookings.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            const container = document.getElementById('bookings-container');
            
            if (filteredBookings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-${currentTab === 'all' ? 'calendar' : 
                                           currentTab === 'upcoming' ? 'clock' : 
                                           currentTab === 'completed' ? 'check-circle' : 
                                           'ban'}"></i>
                        </div>
                        <h3 class="empty-title">
                            ${currentTab === 'all' ? 'No Bookings Yet' :
                              currentTab === 'upcoming' ? 'No Upcoming Bookings' :
                              currentTab === 'completed' ? 'No Completed Bookings' :
                              'No Cancelled Bookings'}
                        </h3>
                        <p class="empty-description">
                            ${currentTab === 'all' ? 'You haven\'t made any bookings yet. Book your first service to get started!' :
                              currentTab === 'upcoming' ? 'You don\'t have any upcoming services booked.' :
                              currentTab === 'completed' ? 'No completed services found.' :
                              'No cancelled bookings found.'}
                        </p>
                        ${currentTab === 'all' ? `
                            <button class="btn btn-primary" onclick="goToServices()">
                                <i class="fas fa-search"></i> Find Services
                            </button>
                        ` : `
                            <button class="btn btn-outline" onclick="switchTab('all')">
                                <i class="fas fa-calendar-alt"></i> View All Bookings
                            </button>
                        `}
                    </div>
                `;
                return;
            }
            
            let html = '';
            filteredBookings.forEach(booking => {
                const provider = easysheba.getUserById(booking.providerId);
                const providerName = provider ? `${provider.firstName} ${provider.lastName}` : 'Provider';
                const providerInitials = provider ? 
                    (provider.firstName.charAt(0) + provider.lastName.charAt(0)).toUpperCase() : 'P';
                const service = easysheba.getServiceByCategory(booking.serviceCategory || provider?.serviceCategory);
                
                // Format dates
                const bookingDate = new Date(booking.createdAt);
                const serviceDate = booking.serviceDate ? new Date(booking.serviceDate) : null;
                
                const createdAgo = getTimeAgo(bookingDate);
                const serviceDateStr = serviceDate ? 
                    serviceDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : 'Not set';
                
                // Status mapping
                const statusMap = {
                    'pending': { 
                        class: 'status-pending', 
                        text: 'Pending',
                        cardClass: 'pending'
                    },
                    'confirmed': { 
                        class: 'status-confirmed', 
                        text: 'Confirmed',
                        cardClass: 'confirmed'
                    },
                    'assigned': { 
                        class: 'status-assigned', 
                        text: 'Assigned',
                        cardClass: 'assigned'
                    },
                    'completed': { 
                        class: 'status-completed', 
                        text: 'Completed',
                        cardClass: 'completed'
                    },
                    'cancelled': { 
                        class: 'status-cancelled', 
                        text: 'Cancelled',
                        cardClass: 'cancelled'
                    }
                };
                
                const status = statusMap[booking.status] || { 
                    class: 'status-pending', 
                    text: 'Pending',
                    cardClass: 'pending'
                };
                
                html += `
                    <div class="booking-card ${status.cardClass}">
                        <div class="booking-header">
                            <div>
                                <div class="booking-code">${booking.bookingCode || 'ESB' + booking.id}</div>
                                <small style="color: #6b7280; font-size: 12px;">${createdAgo}</small>
                            </div>
                            <span class="booking-status ${status.class}">${status.text}</span>
                        </div>
                        
                        <div class="booking-details">
                            <div class="detail-item">
                                <span class="detail-label">Service Date</span>
                                <span class="detail-value">${serviceDateStr}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Service Time</span>
                                <span class="detail-value">${booking.serviceTime || 'Anytime'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Duration</span>
                                <span class="detail-value">${booking.hours || 1} hour${(booking.hours || 1) > 1 ? 's' : ''}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Amount</span>
                                <span class="detail-value">৳${booking.totalAmount || 0}</span>
                            </div>
                        </div>
                        
                        <div class="provider-info">
                            <div class="provider-avatar">${providerInitials}</div>
                            <div class="provider-details">
                                <h4>${providerName}</h4>
                                <p>
                                    <i class="fas fa-tools"></i> ${service?.name || provider?.serviceCategory || 'Service'}
                                    <span class="rating">
                                        <i class="fas fa-star"></i> ${provider?.rating || 'New'}
                                    </span>
                                </p>
                            </div>
                        </div>
                        
                        <div class="booking-actions">
                            <button class="btn btn-primary" onclick="startChat('${booking.providerId}')">
                                <i class="fas fa-comment"></i> Chat
                            </button>
                            
                            ${booking.status === 'pending' ? `
                                <button class="btn btn-danger" onclick="cancelBooking('${booking.bookingCode || booking.id}')">
                                    <i class="fas fa-times"></i> Cancel
                                </button>
                            ` : ''}
                            
                            ${booking.status === 'assigned' ? `
                                <button class="btn btn-success" onclick="trackService('${booking.bookingCode || booking.id}')">
                                    <i class="fas fa-map-marker-alt"></i> Track
                                </button>
                            ` : ''}
                            
                            ${booking.status === 'completed' ? `
                                <button class="btn btn-outline" onclick="addReview('${booking.providerId}', '${booking.bookingCode || booking.id}')">
                                    <i class="fas fa-star"></i> Rate
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays}d ago`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function startChat(providerId) {
            localStorage.setItem('chatWithProvider', providerId);
            window.location.href = 'chat.html';
        }

        function trackService(bookingCode) {
            // For now, show a toast. In future, implement tracking map
            showToast('Service tracking feature coming soon! You can chat with provider for updates.', 'info');
        }

        function addReview(providerId, bookingCode) {
            localStorage.setItem('reviewProviderId', providerId);
            localStorage.setItem('reviewBookingCode', bookingCode);
            window.location.href = 'add-review.html';
        }

        function cancelBooking(bookingCode) {
            if (confirm('Are you sure you want to cancel this booking? This action cannot be undone.')) {
                const success = easysheba.updateBookingStatus(bookingCode, 'cancelled');
                if (success) {
                    showToast('Booking cancelled successfully', 'success');
                    loadStats();
                    loadBookings();
                    
                    // Add notification to provider
                    const booking = easysheba.getBookingByCode(bookingCode);
                    if (booking && booking.providerId) {
                        easysheba.addNotification({
                            userId: booking.providerId,
                            title: 'Booking Cancelled',
                            message: `A customer has cancelled booking ${bookingCode}`,
                            type: 'info',
                            bookingId: booking.id,
                            isRead: false
                        });
                    }
                } else {
                    showToast('Failed to cancel booking', 'error');
                }
            }
        }

        function goToServices() {
            window.location.href = 'customer-dashboard.html';
        }

        function goBack() {
            window.location.href = 'customer-dashboard.html';
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 
                                   type === 'error' ? 'exclamation-circle' : 
                                   'info-circle'}"></i>
                ${message}
            `;
            
            // Remove existing toasts
            document.querySelectorAll('.toast').forEach(t => t.remove());
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.remove();
                }
            }, 3000);
        }
    </script>
</body>
