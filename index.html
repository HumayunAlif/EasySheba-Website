<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySheba - Your Trusted Service Partner</title>
    <style>
        :root {
            --primary: #1D4ED8;
            --secondary: #22C55E;
            --dark: #1f2937;
            --light: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        /* Main Container */
        .splash-container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo Section */
        .logo-section {
            margin-bottom: 40px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-15px) rotate(2deg);
            }
            75% {
                transform: translateY(10px) rotate(-2deg);
            }
        }

        .logo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            animation: rotate 20s linear infinite;
        }

        .logo-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            border-color: rgba(255, 255, 255, 0.2);
            animation-direction: reverse;
            animation-duration: 25s;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .logo-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            z-index: 2;
            position: relative;
            overflow: hidden;
        }

        .logo-placeholder::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        /* Your logo image will be placed here */
        .logo-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            z-index: 3;
            position: relative;
        }

        /* Fallback if logo doesn't load */
        .logo-fallback {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #e5e7eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: none; /* Hide when logo loads */
        }

        /* Text Content */
        .text-content {
            margin-bottom: 40px;
        }

        .app-name {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff, rgba(255, 255, 255, 0.9));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }
            to {
                text-shadow: 0 4px 30px rgba(255, 255, 255, 0.3);
            }
        }

        .tagline {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 10px;
            font-weight: 300;
            line-height: 1.5;
        }

        .sub-tagline {
            font-size: 16px;
            opacity: 0.7;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Loading Animation */
        .loading-section {
            margin-top: 40px;
        }

        .loading-text {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            animation: pulse 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { 
            animation-delay: -0.32s; 
            background: #ffffff;
        }
        .dot:nth-child(2) { 
            animation-delay: -0.16s; 
            background: rgba(255, 255, 255, 0.8);
        }
        .dot:nth-child(3) { 
            background: rgba(255, 255, 255, 0.6);
        }

        @keyframes pulse {
            0%, 80%, 100% { 
                transform: scale(0); 
                opacity: 0.5;
            }
            40% { 
                transform: scale(1); 
                opacity: 1;
            }
        }

        /* Version & Footer */
        .version {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .splash-container {
                padding: 20px;
            }

            .logo-container {
                width: 150px;
                height: 150px;
            }

            .logo-placeholder {
                width: 100px;
                height: 100px;
                border-radius: 20px;
            }

            .logo-image {
                width: 70px;
                height: 70px;
            }

            .app-name {
                font-size: 36px;
            }

            .tagline {
                font-size: 18px;
            }

            .sub-tagline {
                font-size: 14px;
                padding: 0 20px;
            }
        }

        @media (max-width: 480px) {
            .logo-container {
                width: 120px;
                height: 120px;
            }

            .logo-placeholder {
                width: 80px;
                height: 80px;
                border-radius: 15px;
            }

            .logo-image {
                width: 60px;
                height: 60px;
            }

            .app-name {
                font-size: 28px;
            }

            .tagline {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-ring"></div>
                <div class="logo-ring"></div>
                <div class="logo-placeholder">
                    <!-- এইখানে আপনার logo image লিংক করবেন -->
                    <img src="E:\c drive\Desktop\Project Easy Sheba\FInal project\logo.png" alt="EasySheba Logo" class="logo-image" 
                         onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';">
                    <div class="logo-fallback">ES</div>
                </div>
            </div>
        </div>

        <!-- Text Content -->
        <div class="text-content">
            <h1 class="app-name">EasySheba</h1>
            <p class="tagline">Your Trusted Home Service Partner</p>
            <p class="sub-tagline">Connecting customers with verified service professionals for all home maintenance needs</p>
        </div>

        <!-- Loading Section -->
        <div class="loading-section">
            <div class="loading-text">Loading</div>
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <div class="version">v2.0.1</div>

    <script>
        // Check logo loading
        document.addEventListener('DOMContentLoaded', function() {
            const logoImg = document.querySelector('.logo-image');
            
            // Preload logo with timeout
            const img = new Image();
            img.src = logoImg.src;
            
            img.onload = function() {
                console.log('Logo loaded successfully');
                // Add success animation
                logoImg.style.animation = 'fadeIn 0.5s ease';
            };
            
            img.onerror = function() {
                console.log('Logo failed to load, showing fallback');
            };
            
            // Add interactive effects
            const logoPlaceholder = document.querySelector('.logo-placeholder');
            
            logoPlaceholder.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.05)';
                this.style.boxShadow = '0 25px 50px rgba(0, 0, 0, 0.3)';
            });
            
            logoPlaceholder.addEventListener('mouseleave', function() {
                this.style.transform = '';
                this.style.boxShadow = '';
            });
            
            // Add click effect
            logoPlaceholder.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });

        // Redirect to auth page after 3 seconds
        setTimeout(() => {
            // Add fade out animation
            document.body.style.animation = 'fadeOut 0.5s ease forwards';
            setTimeout(() => {
                window.location.href = 'auth.html';
            }, 500);
        }, 3000);

        // Add fade out animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: scale(1);
                }
                to {
                    opacity: 0;
                    transform: scale(0.95);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
