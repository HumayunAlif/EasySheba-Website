<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySheba - Services</title>
    <script src="data-storage.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1D4ED8 0%, #22C55E 100%);
            min-height: 100vh;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(29, 78, 216, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1D4ED8;
            font-weight: bold;
        }

        .header-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1f2937;
        }

        .screen-content {
            padding-top: 80px;
            padding-bottom: 20px;
            min-height: 100vh;
        }

        .providers-list {
            padding: 0 1rem;
        }

        .provider-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin: 8px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .provider-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .provider-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .provider-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1D4ED8 0%, #22C55E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 20px;
            margin-right: 16px;
        }

        .provider-info {
            flex: 1;
        }

        .provider-name {
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .provider-rating {
            font-size: 0.875rem;
            color: #4b5563;
            margin-bottom: 4px;
        }

        .provider-location {
            font-size: 0.875rem;
            color: #4b5563;
            margin-bottom: 4px;
        }

        .provider-specialty {
            font-size: 0.875rem;
            color: #1D4ED8;
            font-weight: 500;
        }

        .provider-price {
            font-weight: 700;
            color: #1D4ED8;
            font-size: 1.125rem;
        }

        .verification-badge {
            display: inline-flex;
            align-items: center;
            background: #22C55E;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        .book-button {
            background: #1D4ED8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .book-button:hover {
            background: #1e40af;
        }

        .chat-button {
            background: #F3F4F6;
            color: #374151;
            border: 1px solid #E5E7EB;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        .no-providers {
            text-align: center;
            padding: 3rem 1rem;
            color: white;
        }

        .no-providers-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .no-providers-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .no-providers-text {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="back-btn" onclick="goBack()">←</div>
        <h1 class="header-title" id="category-title">Services</h1>
        <div style="width: 40px;"></div>
    </div>

    <div class="screen-content">
        <div id="services-list" class="providers-list">
            <!-- Providers will be loaded here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const category = localStorage.getItem('selectedCategory');
            if (category) {
                // Get service name from services data
                const services = easysheba.getServices();
                const service = services.find(s => s.category === category);
                document.getElementById('category-title').textContent = 
                    service ? service.name + ' Services' : 'Services';
                
                loadProviders(category);
            }
        });

        function loadProviders(category) {
            const servicesList = document.getElementById('services-list');
            
            // Get only verified providers for this category
            const providers = easysheba.getProvidersByCategory(category);
            
            if (providers.length === 0) {
                servicesList.innerHTML = `
                    <div class="no-providers">
                        <div class="no-providers-icon">🔍</div>
                        <h3 class="no-providers-title">No Verified Providers Available</h3>
                        <p class="no-providers-text">We're working to add more verified providers in this category</p>
                        <button onclick="goBack()" style="background: white; color: #1D4ED8; border: none; padding: 8px 16px; border-radius: 8px; margin-top: 1rem;">← Go Back</button>
                    </div>
                `;
                return;
            }
            
            let html = '';
            providers.forEach(provider => {
                const initials = provider.firstName.charAt(0) + provider.lastName.charAt(0);
                html += `
                    <div class="provider-card">
                        <div class="provider-header">
                            <div class="provider-avatar">
                                <span>${initials}</span>
                            </div>
                            <div class="provider-info">
                                <h3 class="provider-name">
                                    ${provider.firstName} ${provider.lastName}
                                    ${provider.isVerified ? '<span class="verification-badge">✓ Verified</span>' : ''}
                                </h3>
                                <div class="provider-rating">
                                    ⭐ ${provider.rating || 'New'} • ${provider.experience || 0} years experience
                                </div>
                                <div class="provider-location">📍 ${provider.areas || 'Various areas'}</div>
                                <div class="provider-specialty">${provider.bio || 'Professional service provider'}</div>
                            </div>
                            <div class="provider-price">৳${provider.hourlyRate}/hour</div>
                        </div>
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="chat-button" onclick="event.stopPropagation(); startChat('${provider.id}')">
                                💬 Chat
                            </button>
                            <button class="book-button" onclick="event.stopPropagation(); bookProvider('${provider.id}', '${category}')">
                                Book Now
                            </button>
                        </div>
                    </div>
                `;
            });
            
            servicesList.innerHTML = html;
        }

        function startChat(providerId) {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                showToast('Please login to chat', 'error');
                window.location.href = 'login.html';
                return;
            }
            
            localStorage.setItem('chatWithProvider', providerId);
            window.location.href = 'chat.html';
        }

        function bookProvider(providerId, category) {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                showToast('Please login to book', 'error');
                window.location.href = 'login.html';
                return;
            }
            
            localStorage.setItem('selectedProviderId', providerId);
            localStorage.setItem('selectedCategory', category);
            window.location.href = 'service-details.html';
        }

        function goBack() {
            window.location.href = 'customer-dashboard.html';
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
