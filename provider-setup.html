<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySheba - Complete Your Profile</title>
    <script src="data-storage.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1D4ED8;
            --secondary: #22C55E;
            --dark: #1f2937;
            --light: #f9fafb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Header */
        .app-header {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 16px 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: #f1f5f9;
            color: var(--dark);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            margin-top: 88px;
            padding: 24px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Setup Progress */
        .setup-progress {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .progress-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .progress-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .progress-subtitle {
            color: #6b7280;
            font-size: 16px;
        }

        /* Setup Form */
        .setup-form {
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .form-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .form-subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .form-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }

        .form-section:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-label .required {
            color: var(--danger);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
        }

        .form-control.select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s ease;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
        }

        .form-helper {
            color: #6b7280;
            font-size: 12px;
            margin-top: 4px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid #e5e7eb;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 14px;
            color: #374151;
            cursor: pointer;
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 2px solid #f3f4f6;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #374151;
            border: 2px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
                gap: 12px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <div class="logo-icon">🛠️</div>
            <div class="logo-text">EasySheba</div>
        </div>
        
        <div class="header-actions">
            <button class="back-btn" onclick="goToDashboard()">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Setup Progress -->
        <section class="setup-progress">
            <div class="progress-header">
                <h1 class="progress-title" id="page-title">Complete Your Profile</h1>
                <p class="progress-subtitle" id="page-subtitle">Finish these steps to start receiving job requests</p>
            </div>
        </section>

        <!-- Setup Form -->
        <form class="setup-form" onsubmit="saveProviderProfile(event)">
            <div class="form-header">
                <h2 class="form-title">
                    <i class="fas fa-user-tie"></i>
                    <span id="form-title">Service Provider Information</span>
                </h2>
                <p class="form-subtitle" id="form-subtitle">Fill in your service details to get started</p>
            </div>

            <div class="form-content">
                <!-- Basic Information -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-id-card"></i>
                        Basic Information
                    </h3>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">
                                First Name <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                Last Name <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">
                                Email Address <span class="required">*</span>
                            </label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                Phone Number <span class="required">*</span>
                            </label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                    </div>
                </div>

                <!-- Service Information -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-tools"></i>
                        Service Information
                    </h3>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">
                                Service Category <span class="required">*</span>
                            </label>
                            <select class="form-control select" id="serviceCategory" required>
                                <option value="">Select your service</option>
                                <option value="electrician">⚡ Electrician</option>
                                <option value="plumber">🚿 Plumber</option>
                                <option value="cleaner">🧹 Cleaner</option>
                                <option value="ac-repair">❄️ AC Repair</option>
                                <option value="painter">🎨 Painter</option>
                                <option value="carpenter">🪚 Carpenter</option>
                                <option value="gardener">🌿 Gardener</option>
                                <option value="mechanic">🔧 Mechanic</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                Hourly Rate (৳) <span class="required">*</span>
                            </label>
                            <div style="position: relative;">
                                <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #6b7280;">৳</span>
                                <input type="number" class="form-control" id="hourlyRate" 
                                       min="100" max="5000" step="50" required
                                       style="padding-left: 40px;">
                            </div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Experience (Years)</label>
                            <input type="number" class="form-control" id="experience" 
                                   min="0" max="50">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Service Areas <span class="required">*</span></label>
                            <input type="text" class="form-control" id="areas" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Bio / Description</label>
                        <textarea class="form-textarea" id="bio" 
                                  placeholder="Describe your skills, expertise..."></textarea>
                    </div>
                </div>

                <!-- Address Information -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-map-marker-alt"></i>
                        Address Information
                    </h3>
                    
                    <div class="form-group">
                        <label class="form-label">Full Address</label>
                        <textarea class="form-textarea" id="address" 
                                  placeholder="Enter your complete address..."></textarea>
                    </div>
                </div>

                <!-- Bank Information (Optional) -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-university"></i>
                        Bank Information (For Payments)
                    </h3>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Bank Name</label>
                            <input type="text" class="form-control" id="bankName">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Account Number</label>
                            <input type="text" class="form-control" id="accountNumber">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Account Holder Name</label>
                            <input type="text" class="form-control" id="accountHolderName">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Branch Name</label>
                            <input type="text" class="form-control" id="branchName">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="goToDashboard()">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-save"></i> Save Profile
                </button>
            </div>
        </form>
    </main>

    <script>
        let currentProvider = null;
        let isEditMode = false;

        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            const userData = localStorage.getItem('currentUser');
            if (!userData) {
                window.location.href = 'auth.html';
                return;
            }
            
            try {
                currentProvider = JSON.parse(userData);
                if (currentProvider.userType !== 'provider') {
                    window.location.href = currentProvider.userType === 'admin' ? 
                        'admin-dashboard.html' : 'customer-dashboard.html';
                    return;
                }

                // Check if coming from profile edit
                const fromProfile = localStorage.getItem('editingProfile');
                if (fromProfile === 'true') {
                    isEditMode = true;
                    localStorage.removeItem('editingProfile');
                    
                    document.getElementById('page-title').textContent = 'Edit Your Profile';
                    document.getElementById('page-subtitle').textContent = 'Update your profile information';
                    document.getElementById('form-title').textContent = 'Edit Profile';
                    document.getElementById('form-subtitle').textContent = 'Update your details';
                    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-sync-alt"></i> Update Profile';
                }

                // Fill existing data
                fillFormData();

            } catch (error) {
                console.error('Error:', error);
                window.location.href = 'auth.html';
            }
        });

        function fillFormData() {
            // Basic info
            document.getElementById('firstName').value = currentProvider.firstName || '';
            document.getElementById('lastName').value = currentProvider.lastName || '';
            document.getElementById('email').value = currentProvider.email || '';
            document.getElementById('phone').value = currentProvider.phone || '';
            
            // Service info
            document.getElementById('serviceCategory').value = currentProvider.serviceCategory || '';
            document.getElementById('hourlyRate').value = currentProvider.hourlyRate || '';
            document.getElementById('experience').value = currentProvider.experience || '';
            document.getElementById('areas').value = currentProvider.areas || '';
            document.getElementById('bio').value = currentProvider.bio || '';
            
            // Address
            document.getElementById('address').value = currentProvider.address || '';
            
            // Bank info
            document.getElementById('bankName').value = currentProvider.bankName || '';
            document.getElementById('accountNumber').value = currentProvider.accountNumber || '';
            document.getElementById('accountHolderName').value = currentProvider.accountHolderName || '';
            document.getElementById('branchName').value = currentProvider.branchName || '';
            
            // Disable email field if in edit mode
            if (isEditMode) {
                document.getElementById('email').disabled = true;
            }
        }

        function saveProviderProfile(event) {
            event.preventDefault();
            
            if (!currentProvider) {
                showToast('Please login first', 'error');
                return;
            }
            
            // Disable submit button
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            // Collect form data
            const providerData = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                serviceCategory: document.getElementById('serviceCategory').value,
                hourlyRate: parseInt(document.getElementById('hourlyRate').value) || 0,
                experience: parseInt(document.getElementById('experience').value) || 0,
                areas: document.getElementById('areas').value.trim(),
                bio: document.getElementById('bio').value.trim(),
                address: document.getElementById('address').value.trim(),
                bankName: document.getElementById('bankName').value.trim(),
                accountNumber: document.getElementById('accountNumber').value.trim(),
                accountHolderName: document.getElementById('accountHolderName').value.trim(),
                branchName: document.getElementById('branchName').value.trim(),
                profileUpdatedAt: new Date().toISOString()
            };
            
            // Validate required fields
            if (!providerData.firstName || !providerData.lastName || !providerData.email || 
                !providerData.phone || !providerData.serviceCategory || !providerData.hourlyRate || 
                !providerData.areas) {
                showToast('Please fill all required fields', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = isEditMode ? 
                    '<i class="fas fa-sync-alt"></i> Update Profile' : 
                    '<i class="fas fa-save"></i> Save Profile';
                return;
            }
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(providerData.email)) {
                showToast('Please enter a valid email address', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = isEditMode ? 
                    '<i class="fas fa-sync-alt"></i> Update Profile' : 
                    '<i class="fas fa-save"></i> Save Profile';
                return;
            }
            
            // Validate hourly rate range
            if (providerData.hourlyRate < 100 || providerData.hourlyRate > 5000) {
                showToast('Hourly rate must be between ৳100 and ৳5000', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = isEditMode ? 
                    '<i class="fas fa-sync-alt"></i> Update Profile' : 
                    '<i class="fas fa-save"></i> Save Profile';
                return;
            }
            
            try {
                // Update user in storage
                const success = easysheba.updateUser(currentProvider.id, providerData);
                
                if (!success) {
                    throw new Error('Failed to update profile');
                }
                
                // Update current user in localStorage
                const updatedUser = { ...currentProvider, ...providerData };
                localStorage.setItem('currentUser', JSON.stringify(updatedUser));
                
                // Show success message
                if (isEditMode) {
                    showToast('Profile updated successfully!', 'success');
                    
                    // Redirect back to dashboard after delay
                    setTimeout(() => {
                        window.location.href = 'provider-jobs.html';
                    }, 1500);
                } else {
                    // For new providers, mark setup as complete
                    easysheba.updateUser(currentProvider.id, {
                        completedSetup: true,
                        setupCompletedAt: new Date().toISOString()
                    });
                    
                    showToast('Profile setup completed! Awaiting admin verification.', 'success');
                    
                    // Add notification for admin
                    easysheba.addNotification({
                        userId: 1, // Admin ID
                        title: 'New Provider Registration',
                        message: `${providerData.firstName} ${providerData.lastName} has completed profile setup. Please verify their account.`,
                        type: 'info',
                        providerId: currentProvider.id,
                        isRead: false
                    });
                    
                    // Redirect to jobs page after delay
                    setTimeout(() => {
                        window.location.href = 'provider-jobs.html';
                    }, 2000);
                }
                
            } catch (error) {
                console.error('Error saving provider data:', error);
                showToast('Error saving profile. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = isEditMode ? 
                    '<i class="fas fa-sync-alt"></i> Update Profile' : 
                    '<i class="fas fa-save"></i> Save Profile';
            }
        }

        function goToDashboard() {
            if (isEditMode) {
                window.location.href = 'provider-jobs.html';
            } else {
                if (confirm('Leave without saving? Your progress will be lost.')) {
                    window.location.href = 'provider-jobs.html';
                }
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                ${message}
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
